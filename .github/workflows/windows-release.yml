name: Packed archive read-path checks
on:
  push:
    branches: ['experiment/spawn-packed-view-136']
permissions:
  contents: read
jobs:
  packed:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile and compare actual Win32 mapped slices
        shell: pwsh
        run: |
          cmake -S ci/spawn-archives -B checks -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Fixture configure failed' }
          cmake --build checks --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Fixture compile failed' }
          & checks/Release/ixray_packed_view_check.exe
          if ($LASTEXITCODE -ne 0) { throw 'Packed view differential failed' }
